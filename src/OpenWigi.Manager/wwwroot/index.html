<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OpenWigiDash Manager</title>
    <base href="/" />
    <link href="_content/MudBlazor/MudBlazor.min.css" rel="stylesheet" />
    <link href="css/app.css" rel="stylesheet" />
</head>
<body>
    <div id="app">Carregando...</div>

    <div id="blazor-error-ui">
        Algo deu errado na janela.
        <a href="" class="reload">Recarregar</a>
        <a class="dismiss">🗙</a>
    </div>

    <script src="_framework/blazor.webview.js"></script>
    <script src="_content/MudBlazor/MudBlazor.min.js"></script>
    <script>
        window.owd = {
            // Tamanho em pixels de um elemento, para converter o clique na prévia em coordenadas do aparelho.
            size: el => {
                const r = el.getBoundingClientRect();
                return [r.width, r.height];
            },
            // Posição e tamanho na janela, para o editor saber em qual célula da grade o ponteiro está.
            rect: el => {
                const r = el.getBoundingClientRect();
                return [r.left, r.top, r.width, r.height];
            },
            // Retângulos de vários elementos (as miniaturas das páginas), na ordem do documento. Cortados pela
            // faixa que rola (.owd-pages): miniatura fora da vista não vira alvo de soltar.
            rects: selector => [...document.querySelectorAll(selector)].map(el => {
                const r = el.getBoundingClientRect();
                const clip = el.closest('.owd-pages')?.getBoundingClientRect();
                if (!clip) return [r.left, r.top, r.width, r.height];
                const left = Math.max(r.left, clip.left), right = Math.min(r.right, clip.right);
                return right > left ? [left, r.top, right - left, r.height] : [0, 0, 0, 0];
            }),
            // Avisa quando a janela fica mais estreita ou mais larga que `width` (o menu lateral recolhe ou abre).
            onNarrow: (target, width) => {
                const query = window.matchMedia(`(max-width: ${width - 0.02}px)`);
                const handler = () => target.invokeMethodAsync('NarrowChanged', query.matches);
                query.addEventListener('change', handler);
                handler();
                return { dispose: () => query.removeEventListener('change', handler) };
            },
            // Carrossel de páginas: a roda do mouse rola de lado. Na ponta, deixa a roda rolar a tela.
            wheelScrollsSideways: el => {
                const handler = e => {
                    if (e.ctrlKey || Math.abs(e.deltaX) > Math.abs(e.deltaY)) return;
                    const max = el.scrollWidth - el.clientWidth;
                    if (max <= 0 || (e.deltaY < 0 && el.scrollLeft <= 0) || (e.deltaY > 0 && el.scrollLeft >= max - 1)) return;
                    e.preventDefault();
                    el.scrollLeft += e.deltaY;
                };
                el.addEventListener('wheel', handler, { passive: false });
                return { dispose: () => el.removeEventListener('wheel', handler) };
            },
            // Traz para a vista o cartão selecionado da faixa que rola, sem mexer na rolagem da tela.
            revealSelected: el => {
                const card = el?.querySelector('.selected');
                if (!card) return;
                const box = el.getBoundingClientRect(), r = card.getBoundingClientRect();
                if (r.left < box.left) el.scrollLeft -= box.left - r.left + 8;
                else if (r.right > box.right) el.scrollLeft += r.right - box.right + 8;
            },
            // Arrastar um widget para fora do Canvas (até uma miniatura): o Canvas segura o ponteiro até soltar,
            // senão o arraste acabaria ao sair dele.
            capture: (el, pointerId) => {
                try { el.setPointerCapture(pointerId); } catch { /* o ponteiro já foi solto */ }
            },
            // Ctrl+C, Ctrl+X, Ctrl+V e Ctrl+D no editor de widgets. Como o Delete: não vale digitando nem com diálogo aberto.
            onEditKeys: target => {
                const keys = { c: 'copy', x: 'cut', v: 'paste', d: 'duplicate' };
                const handler = e => {
                    const action = e.key === 'Escape' ? 'escape' : (e.ctrlKey || e.metaKey) && !e.altKey && !e.shiftKey ? keys[e.key.toLowerCase()] : null;
                    if (!action || e.repeat) return;
                    const el = document.activeElement;
                    if (el && (el.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName))) return;
                    if (document.querySelector('.mud-dialog')) return;
                    // Texto selecionado na janela: o Ctrl+C é do texto.
                    if (action === 'copy' && String(window.getSelection() ?? '').length > 0) return;
                    if (action !== 'escape') e.preventDefault();
                    target.invokeMethodAsync('EditKey', action);
                };
                document.addEventListener('keydown', handler);
                return { dispose: () => document.removeEventListener('keydown', handler) };
            },
            // Delete no editor de widgets. Não vale enquanto se digita (campo de nome) ou com um diálogo aberto.
            onDeleteKey: target => {
                const handler = e => {
                    if (e.key !== 'Delete' || e.repeat) return;
                    const el = document.activeElement;
                    if (el && (el.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName))) return;
                    if (document.querySelector('.mud-dialog')) return;
                    e.preventDefault();
                    target.invokeMethodAsync('DeletePressed');
                };
                document.addEventListener('keydown', handler);
                return { dispose: () => document.removeEventListener('keydown', handler) };
            },
            // Altura que sobra para o Canvas: a janela menos tudo o que não é ele (cabeçalho, faixas, páginas).
            // Medido em vez de chutado, para a tela não passar da janela em nenhuma resolução ou escala. O Canvas
            // não fica menor que --owd-canvas-min (tiles pequenos demais para ver e pegar): abaixo disso ele rola
            // dentro da sua janela (.owd-canvas-viewport), e o carrossel de páginas continua à vista.
            // A variável vai na .owd-editor: a coluna do Canvas também a usa para dar o resto da largura ao painel.
            // O painel do widget não entra na conta: ele tem a altura da linha do Canvas e rola por dentro.
            fitCanvas: canvas => {
                const editor = canvas.closest('.owd-editor');
                const viewport = canvas.closest('.owd-canvas-viewport') ?? canvas;
                const container = canvas.closest('.mud-container');
                let frame = 0;
                const fit = () => {
                    frame = 0;
                    const content = container.getBoundingClientRect().bottom + window.scrollY;
                    const around = content - viewport.getBoundingClientRect().height;
                    editor.style.setProperty('--owd-canvas-height', Math.max(0, Math.floor(window.innerHeight - around - 1)) + 'px');
                };
                const schedule = () => frame ||= requestAnimationFrame(fit);
                const observer = new ResizeObserver(schedule);
                observer.observe(container);
                window.addEventListener('resize', schedule);
                fit();
                return {
                    dispose: () => {
                        observer.disconnect();
                        window.removeEventListener('resize', schedule);
                        cancelAnimationFrame(frame);
                    }
                };
            }
        };
    </script>
</body>
</html>
