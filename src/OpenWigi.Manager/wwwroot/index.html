<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OpenWigiDash Manager</title>
    <base href="/" />
    <link href="_content/MudBlazor/MudBlazor.min.css" rel="stylesheet" />
    <link href="css/app.css" rel="stylesheet" />
</head>
<body>
    <div id="app">Carregando...</div>

    <div id="blazor-error-ui">
        Algo deu errado na janela.
        <a href="" class="reload">Recarregar</a>
        <a class="dismiss">🗙</a>
    </div>

    <script src="_framework/blazor.webview.js"></script>
    <script src="_content/MudBlazor/MudBlazor.min.js"></script>
    <script>
        window.owd = {
            // Tamanho em pixels de um elemento, para converter o clique na prévia em coordenadas do aparelho.
            size: el => {
                const r = el.getBoundingClientRect();
                return [r.width, r.height];
            },
            // Posição e tamanho na janela, para o editor saber em qual célula da grade o ponteiro está.
            rect: el => {
                const r = el.getBoundingClientRect();
                return [r.left, r.top, r.width, r.height];
            },
            // Delete no editor de widgets. Não vale enquanto se digita (campo de nome) ou com um diálogo aberto.
            onDeleteKey: target => {
                const handler = e => {
                    if (e.key !== 'Delete' || e.repeat) return;
                    const el = document.activeElement;
                    if (el && (el.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName))) return;
                    if (document.querySelector('.mud-dialog')) return;
                    e.preventDefault();
                    target.invokeMethodAsync('DeletePressed');
                };
                document.addEventListener('keydown', handler);
                return { dispose: () => document.removeEventListener('keydown', handler) };
            }
        };
    </script>
</body>
</html>
