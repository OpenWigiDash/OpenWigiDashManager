name: Publicar SDK no NuGet

# Publica o pacote victorperez2911.OpenWigi.Sdk (o contrato dos widgets) no nuget.org.
# Tag própria (sdk-vX.Y.Z) para não se misturar com as releases do manager (vX.Y.Z).
on:
  push:
    tags:
      - 'sdk-v*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Versão da tag
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}' -replace '^sdk-v', ''
          if ('${{ github.ref_type }}' -ne 'tag') { $version = '0.0.0-ci.${{ github.run_number }}' }
          echo "VERSION=$version" >> $env:GITHUB_ENV

      - name: Testes do SDK
        run: dotnet test tests/OpenWigi.Sdk.Tests --configuration Release

      - name: Pack
        run: dotnet pack src/OpenWigi.Sdk --configuration Release --output nupkgs /p:Version=${{ env.VERSION }}

      - name: Push
        if: github.ref_type == 'tag'
        run: dotnet nuget push nupkgs/*.nupkg --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
