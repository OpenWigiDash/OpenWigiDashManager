name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build --configuration Release
      - run: dotnet test --configuration Release --no-build
      - name: Tela do serviço (PNGs dos testes, para conferir o desenho)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tela-do-servico
          path: tests/OpenWigi.Service.Tests/bin/Release/**/service-screen/*.png
          if-no-files-found: ignore
      - name: Pacote de plugin
        shell: pwsh
        run: ./scripts/Test-PluginPackage.ps1 -Configuration Release
      - name: Lista de plugins verificados (schema)
        shell: pwsh
        run: |
          if (-not (Test-Json -Path plugins/verified.json -SchemaFile plugins/verified.schema.json)) { exit 1 }
