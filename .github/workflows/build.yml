name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build --configuration Release
      - run: dotnet test --configuration Release --no-build
      - name: Pacote de plugin
        shell: pwsh
        run: ./scripts/Test-PluginPackage.ps1 -Configuration Release
      - name: Lista de plugins verificados (schema)
        shell: pwsh
        run: |
          if (-not (Test-Json -Path plugins/verified.json -SchemaFile plugins/verified.schema.json)) { exit 1 }
